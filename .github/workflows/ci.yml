name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Runs everything, the `example` job included, on any branch:
  # `gh workflow run ci.yml --ref <branch>`. Otherwise a change to that job is first
  # tested after it is merged.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version-file: .nvmrc
          # The after_prepare hooks in scripts/ run on the merchant's Node, not ours,
          # and Cordova 13 still accepts 20. The tooling needs 22, so this entry is
          # the only thing that notices a script picking up an API 20 lacks.
          # It sits on 20.17.0 because that is the floor Cordova declares. A later 20
          # already has what arrived since (require(esm) turned on in 20.19.0, for one),
          # so a hook relying on it would pass here and break on a merchant's 20.17.
          - node-version: 20.17.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:versions
      - run: npm run verify:keys

  # macos-26, not macos-15: macos-15 builds with Xcode 16.4 by default, and App Store
  # Connect has required Xcode 26 since April 28, 2026, so that is what merchants build
  # the plugin with.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # The package declares platforms: [.iOS(.v13)] and CordovaLib is UIKit-only,
      # so `swift test` cannot work here: it would try to build for macOS. The tests
      # have to go through a simulator destination.
      - name: Cache the SPM resolution
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
      - name: Build the package
        run: xcodebuild build -scheme cordova-khipu -destination generic/platform=iOS
      - name: Run the package tests
        run: xcodebuild test -scheme cordova-khipu -destination 'platform=iOS Simulator,name=iPhone 17'

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # gradle-wrapper.jar is a binary no diff can review. This action compares its
      # checksum against Gradle's published ones, and it is the only defence against
      # an altered wrapper.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Unit-test the pure half
        run: ./gradlew test
        working-directory: tests/android
      - run: npm ci
      # The only check that compiles KhipuPlugin.java, which needs Cordova on the
      # classpath. It runs on every pull request because Ubuntu makes it cheap; the
      # iOS half of the example runs on push and on dispatch, in the `example` job.
      - name: Build the example's Android platform
        run: |
          npm install
          npm run plugin:add
          npx cordova platform add android@15.1.0 --nosave
          npx cordova build android --debug
        working-directory: example

  example:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # Xcode 26, for the same reason as the ios job.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The only thing that exercises the full install path: the after_prepare hooks,
      # the podspec and the SPM package. Both iOS majors, because the plugin supports
      # CocoaPods on cordova-ios 7 and SPM on 8, and the two paths differ.
      - name: Install the plugin into the example
        run: |
          npm install
          npm run plugin:add
        working-directory: example
      - name: Build with cordova-ios 8 (SPM)
        run: |
          npx cordova platform add ios@8.1.1 --nosave
          npx cordova build ios --emulator
        working-directory: example
      # Without a target, cordova-ios 7 takes the last iPhone device type it lists and asks
      # xcodebuild for it on OS:latest, whether or not that runtime has it: on macos-26 it
      # picked iPhone 16e, which only the iOS 26.2 runtime carries. The generic destination
      # is what cordova-ios 8 already passes, and a build needs no particular device.
      - name: Build with cordova-ios 7 (CocoaPods)
        run: |
          npm run reset
          npm run plugin:add
          npx cordova platform add ios@7.1.1 --nosave
          npx cordova build ios --emulator --buildFlag="-destination generic/platform=iOS Simulator"
        working-directory: example
